name: checks
# Pull requests run on the pull_request event; a push to a branch with an open PR would run everything a second time, so push
# only runs on main.
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same pull request cancels the older run (it is about to be replaced), so quick pushes do not pile up and
# jam the hosted runners. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:static
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:mobile
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:enemies
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:store
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:bosses
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:characters
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:event
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:town
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:demo
        env:
          CHROME_PATH: /usr/bin/google-chrome
